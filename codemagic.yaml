workflows:
  react-native-android:
    name: Word Game CH - Android Build (SDK 51)
    max_build_duration: 30
    environment:
      vars:
        NODE_ENV: production
        EXPO_NO_TELEMETRY: 1
      node: 20.11.1
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies and downgrade to Expo SDK 51
        script: |
          npm install -g @expo/cli@latest
          # Force downgrade to Expo SDK 51 (stable)
          npm install expo@~51.0.0
          npm install @expo/metro-runtime@~3.2.1
          npm install react@18.2.0 react-dom@18.2.0
          npm install react-native@0.74.5
          npm install react-native-gesture-handler@~2.16.1
          npm install react-native-reanimated@~3.10.1
          npm install react-native-safe-area-context@4.10.5
          npm install react-native-screens@3.31.1
          npm install react-native-web@~0.19.10
          npm install expo-haptics@~12.8.1
          npm install expo-status-bar@~1.12.1
          npm install expo-splash-screen@~0.27.5
      - name: Prebuild for Android with SDK 51
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - votre-email@gmail.com
        notify:
          success: true
          failure: true
