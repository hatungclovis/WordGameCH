workflows:
  react-native-android:
    name: Word Game CH - Android Build
    max_build_duration: 30
    environment:
      vars:
        NODE_ENV: production
        EXPO_NO_TELEMETRY: 1
        ANDROID_COMPILE_SDK_VERSION: 34
        ANDROID_TARGET_SDK_VERSION: 34
        ANDROID_BUILD_TOOLS_VERSION: 34.0.0
      node: 20.11.1
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install -g @expo/cli@latest
          rm -rf node_modules package-lock.json
          npm install
      - name: Prebuild and fix Android configuration
        script: |
          rm -rf android ios .expo
          npx expo prebuild --platform android --clean
          # Fix gradle.properties for consistent SDK versions
          cd android
          echo "android.compileSdkVersion=34" >> gradle.properties
          echo "android.targetSdkVersion=34" >> gradle.properties
          echo "android.buildToolsVersion=34.0.0" >> gradle.properties
          echo "android.minSdkVersion=24" >> gradle.properties
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - votre-email@gmail.com
        notify:
          success: true
          failure: true
