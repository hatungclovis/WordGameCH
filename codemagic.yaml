workflows:
  react-native-android:
    name: Word Game CH - Android Build
    max_build_duration: 30
    environment:
      vars:
        NODE_ENV: production
        EXPO_NO_TELEMETRY: 1
        ANDROID_COMPILE_SDK_VERSION: 34
        ANDROID_TARGET_SDK_VERSION: 34
        ANDROID_BUILD_TOOLS_VERSION: 34.0.0
        JAVA_HOME: /Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents/Home
      node: 20.11.1
      java: 17
      xcode: 15.0
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Set up Java 17
        script: |
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents/Home
          java -version
      - name: Install dependencies
        script: |
          npm install -g @expo/cli@latest
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install
      - name: Clean and Prebuild
        script: |
          rm -rf android ios .expo
          npx expo prebuild --platform android --clean
      - name: Fix Android configuration
        script: |
          cd android
          # Ensure proper SDK versions are set
          echo "android.compileSdkVersion=34" >> gradle.properties
          echo "android.targetSdkVersion=34" >> gradle.properties
          echo "android.buildToolsVersion=34.0.0" >> gradle.properties
          echo "android.minSdkVersion=23" >> gradle.properties
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          
          # Make gradlew executable
          chmod +x gradlew
          
          # Clean any previous builds
          ./gradlew clean
      - name: Build Android APK (Debug)
        script: |
          cd android
          ./gradlew assembleDebug
      - name: Build Android APK (Release)
        script: |
          cd android
          ./gradlew assembleRelease
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - hatungclovis@gmail.com
        notify:
          success: true
          failure: true